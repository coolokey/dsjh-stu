<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生個人資訊查詢系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; background-color: #f9fafb; }
      
      .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #2563eb;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      #init-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.98); z-index: 50;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
      }
      
      .table-header { @apply p-3 border border-cyan-600 text-center font-bold; }
      .table-cell { @apply p-3 border border-gray-300; }
    </style>
  </head>
  <body>
    
    <!-- 初始化遮罩 -->
    <div id="init-overlay">
      <div class="loader" style="width: 50px; height: 50px; border-width: 5px;"></div>
      <p class="mt-4 text-gray-700 font-bold text-lg tracking-wider" id="loadingText">正在下載資料庫...</p>
      <p class="mt-2 text-gray-400 text-sm hidden" id="errorDetail"></p>
    </div>

    <div class="max-w-7xl mx-auto bg-white shadow-xl min-h-screen flex flex-col">
      <!-- 標題區 -->
      <div class="bg-white p-6 text-center border-b-4 border-blue-600">
        <h1 class="text-3xl font-extrabold text-gray-800 tracking-wider mb-2">學生個人資訊查詢</h1>
        <p id="headerInfo" class="text-xl font-bold text-blue-600">請選擇年級與班級</p>
      </div>

      <!-- 公告區 -->
      <div class="bg-yellow-50 p-4 text-center border-b border-yellow-200">
        <p class="font-bold text-gray-800 text-lg mb-2">全校同學均已開通「Google大溪國中雲端帳號」！</p>
        <div class="flex flex-wrap justify-center gap-3 text-sm font-medium">
           <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded border border-orange-200">Scratch帳號：f51xxxxx</span>
           <span class="bg-green-100 text-green-800 px-3 py-1 rounded border border-green-200">學習吧帳號：TYCDSxxxxx</span>
        </div>
      </div>

      <!-- 查詢控制區 -->
      <div class="p-6 bg-gray-100 flex justify-center items-center gap-6 flex-wrap border-b border-gray-200 shadow-inner">
        <div class="flex items-center bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-300">
          <label class="font-bold mr-2 text-gray-700 text-lg">年級：</label>
          <select id="yearSelect" onchange="updateClassOptions()" class="p-1 outline-none font-bold text-blue-700 text-xl w-24 cursor-pointer bg-transparent">
            <option value="">...</option>
          </select> 
          <span class="ml-1 text-gray-500 font-bold">年</span>
        </div>
        
        <div class="flex items-center bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-300">
          <label class="font-bold mr-2 text-gray-700 text-lg">班級：</label>
          <select id="classSelect" class="p-1 outline-none font-bold text-blue-700 text-xl w-24 cursor-pointer bg-transparent">
             <option value="">--</option>
          </select> 
          <span class="ml-1 text-gray-500 font-bold">班</span>
        </div>

        <button onclick="search()" id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-10 rounded-lg shadow-lg transition transform active:scale-95 text-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <span>查詢</span>
        </button>
      </div>

      <!-- 資料顯示區 -->
      <div class="p-4 md:p-8 overflow-x-auto flex-grow bg-white">
        <div id="loadingMsg" class="hidden text-center text-gray-500 py-16">
          <div class="loader mr-2"></div> 
          <span class="text-xl font-medium text-gray-600">資料讀取中...</span>
        </div>

        <table id="resultTable" class="w-full text-left border-collapse hidden min-w-[900px]">
          <thead>
            <tr class="bg-cyan-600 text-white text-base">
              <th class="table-header w-24">班級</th>
              <th class="table-header w-24">座號</th>
              <th class="table-header w-40">學號</th>
              <th class="table-header w-32">姓名</th>
              <th class="table-header">E-mail</th>
              <th class="table-header">Scratch</th>
              <th class="table-header">學習吧</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-base text-gray-800"></tbody>
        </table>
        
        <div id="noDataMsg" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
          <p class="text-2xl font-bold text-gray-500">此班級目前查無資料</p>
        </div>
      </div>
      
      <div class="bg-gray-50 p-3 text-center text-gray-400 text-sm border-t border-gray-200">
        系統設計：GitHub Pages (Static JSON)
      </div>
    </div>

    <script>
      // ==========================================
      // 【設定區】請設定您的 JSON 資料檔路徑
      // ==========================================
      const JSON_DATA_URL = "students.json"; 
      // ==========================================
      
      var allStudentData = []; // 儲存所有學生資料
      var schoolStructure = {}; // 儲存年級結構

      // 1. 網頁載入時：一次下載所有資料
      window.onload = function() {
        
        // 顯示載入中
        document.getElementById('init-overlay').style.display = 'flex';

        // ★修正重點：加入 try-catch 與錯誤處理，防止在預覽環境下報錯
        try {
          fetch(JSON_DATA_URL)
            .then(res => {
              if (!res.ok) throw new Error("網路回應錯誤 (404/500) 或找不到檔案");
              return res.json();
            })
            .then(data => {
              console.log("資料下載成功，共 " + data.length + " 筆");
              allStudentData = data;
              parseStructure(data);
              initDropdowns(schoolStructure);
            })
            .catch(err => {
              console.warn("無法讀取 students.json，啟用預覽模擬模式:", err);
              // 啟用模擬資料，讓介面在預覽時也能操作
              useMockData(err.message);
            });
        } catch (e) {
          // 捕捉同步錯誤 (如 URL 解析失敗)
          console.warn("Fetch 執行失敗，啟用預覽模擬模式:", e);
          useMockData(e.message);
        }
      };

      // ★新增：使用模擬資料的函式 (防呆用)
      function useMockData(errorMsg) {
        // 模擬資料
        var mockData = [
          {"year": "7", "class": "01", "seat": "01", "id": "1120001", "name": "預覽-王小明", "email": "demo1@dsjh.tyc.edu.tw", "scratch": "s1120001", "learn": "L1120001"},
          {"year": "7", "class": "01", "seat": "02", "id": "1120002", "name": "預覽-陳大文", "email": "demo2@dsjh.tyc.edu.tw", "scratch": "s1120002", "learn": "L1120002"},
          {"year": "8", "class": "05", "seat": "05", "id": "1110505", "name": "預覽-林小美", "email": "demo3@dsjh.tyc.edu.tw", "scratch": "s1110505", "learn": "L1110505"},
          {"year": "9", "class": "08", "seat": "01", "id": "1100801", "name": "預覽-張志豪", "email": "demo4@dsjh.tyc.edu.tw", "scratch": "s1100801", "learn": "L1100801"}
        ];

        console.log("已載入模擬資料 (共 " + mockData.length + " 筆)");
        allStudentData = mockData;
        parseStructure(mockData);
        initDropdowns(schoolStructure);
        
        // 更新 UI 提示使用者目前是預覽模式
        var loadingText = document.getElementById('loadingText');
        var errorDetail = document.getElementById('errorDetail');
        if (loadingText) loadingText.innerText = "預覽模式 (無資料檔)";
        if (errorDetail) {
           errorDetail.innerText = "原因: " + errorMsg;
           errorDetail.classList.remove('hidden');
        }

        // 稍微停留一下讓使用者看到提示，再進入系統
        setTimeout(function() {
           document.getElementById('init-overlay').style.display = 'none';
        }, 800);
      }

      // 解析年級與班級結構
      function parseStructure(data) {
        schoolStructure = {};
        
        data.forEach(student => {
          let y = String(student.year || "").trim();
          let c = String(student.class || "").trim();
          
          if (y && c) {
            if (c.length === 1) c = "0" + c;
            
            if (!schoolStructure[y]) {
              schoolStructure[y] = [];
            }
            if (!schoolStructure[y].includes(c)) {
              schoolStructure[y].push(c);
            }
          }
        });
        
        for (let y in schoolStructure) {
          schoolStructure[y].sort();
        }
      }

      // 初始化選單
      function initDropdowns(structure) {
        var yearSelect = document.getElementById('yearSelect');
        yearSelect.innerHTML = "";

        var years = Object.keys(structure).sort((a, b) => a - b);

        if (years.length === 0) {
          yearSelect.innerHTML = "<option>無資料</option>";
          document.getElementById('init-overlay').style.display = 'none';
          return;
        }

        years.forEach(y => {
          var opt = document.createElement('option');
          opt.value = y; opt.innerText = y; yearSelect.appendChild(opt);
        });

        updateClassOptions();
        document.getElementById('init-overlay').style.display = 'none';
      }

      // 更新班級選單
      function updateClassOptions() {
        var yearSelect = document.getElementById('yearSelect');
        var classSelect = document.getElementById('classSelect');
        classSelect.innerHTML = ""; 
        
        var selectedYear = yearSelect.value;
        var classes = schoolStructure[selectedYear];
        
        if (classes) {
          classes.forEach(c => {
            var opt = document.createElement('option');
            opt.value = c; opt.innerText = c; classSelect.appendChild(opt);
          });
        } else {
           classSelect.innerHTML = "<option>--</option>";
        }
      }

      // 查詢 (本地極速篩選)
      function search() {
        var year = document.getElementById('yearSelect').value;
        var cls = document.getElementById('classSelect').value;
        
        if (!year || !cls) { alert("請選擇完整"); return; }

        document.getElementById('headerInfo').innerText = `查詢中：${year} 年 ${cls} 班...`;
        document.getElementById('loadingMsg').classList.remove('hidden');
        document.getElementById('resultTable').classList.add('hidden');
        document.getElementById('noDataMsg').classList.add('hidden');
        document.getElementById('searchBtn').disabled = true;

        setTimeout(() => {
            const results = allStudentData.filter(student => {
                let sy = String(student.year || "").trim();
                let sc = String(student.class || "").trim();
                if (sc.length === 1) sc = "0" + sc; 
                return sy === year && sc === cls;
            });
            
            results.sort((a, b) => Number(a.seat) - Number(b.seat));
            showData(results);
        }, 200);
      }

      // 顯示資料 (包含連結功能)
      function showData(data) {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = ""; 
        document.getElementById('loadingMsg').classList.add('hidden');
        document.getElementById('searchBtn').disabled = false;
        
        var year = document.getElementById('yearSelect').value;
        var cls = document.getElementById('classSelect').value;
        document.getElementById('headerInfo').innerText = `班級：${year} 年 ${cls} 班 一般班`;

        if (!data || data.length === 0) {
          document.getElementById('noDataMsg').classList.remove('hidden');
          return;
        }

        data.forEach(st => {
          var tr = document.createElement('tr');
          tr.className = "hover:bg-cyan-50 even:bg-slate-50 border-b";
          tr.innerHTML = `
            <td class="table-cell text-center font-bold text-blue-800">${cls}</td>
            <td class="table-cell text-center font-medium">${st.seat}</td>
            <td class="table-cell text-gray-600">${st.id}</td>
            <td class="table-cell text-blue-600 font-bold underline cursor-pointer hover:text-blue-800 text-lg" onclick="window.open('http://gmail.com/', '_blank')" title="前往 Gmail">${st.name}</td>
            <td class="table-cell font-mono text-sm">${st.email}</td>
            <td class="table-cell text-blue-500 underline cursor-pointer hover:text-blue-700" onclick="window.open('https://scratch.mit.edu/', '_blank')" title="前往 Scratch">${st.scratch}</td>
            <td class="table-cell text-blue-500 underline cursor-pointer hover:text-blue-700" onclick="window.open('https://www.learnmode.net/home/', '_blank')" title="前往 學習吧">${st.learn}</td>
          `;
          tbody.appendChild(tr);
        });
        document.getElementById('resultTable').classList.remove('hidden');
      }
    </script>
  </body>
</html>

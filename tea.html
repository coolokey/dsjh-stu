<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大溪國中教師通訊錄查詢系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for tab navigation on mobile */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .table-row-hover:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-school text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">大溪國中教師通訊錄</h1>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-6 w-full">
        
        <!-- Search Section -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6 border border-gray-200">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" 
                    class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 sm:text-sm transition duration-150 ease-in-out" 
                    placeholder="搜尋姓名、職稱 (例如: 林晏瑄, 701, 數學, 主任)...">
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="mb-4 overflow-x-auto hide-scrollbar">
            <div class="flex space-x-2 min-w-max" id="categoryTabs">
                <button onclick="filterCategory('all')" class="tab-btn active px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white transition-colors duration-200 hover:bg-blue-700 shadow-sm">
                    全部顯示
                </button>
                <button onclick="filterCategory('admin')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-colors duration-200">
                    行政人員
                </button>
                <button onclick="filterCategory('homeroom')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-colors duration-200">
                    導師
                </button>
                <button onclick="filterCategory('teacher')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-colors duration-200">
                    專任教師
                </button>
                <button onclick="filterCategory('substitute')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-colors duration-200">
                    代課/兼課
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="flex justify-between items-center mb-2 px-1 text-gray-600 text-sm font-medium">
            <span id="resultCount">資料載入中...</span>
        </div>

        <!-- Table Container -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-32">
                                職稱
                            </th>
                            <th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-40">
                                姓名
                            </th>
                            <th class="px-5 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                電子郵件信箱 (點擊開啟 Gmail)
                            </th>
                        </tr>
                    </thead>
                    <tbody id="teacherTableBody" class="bg-white">
                        <!-- Rows will be injected here by JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <!-- No Results State inside table container -->
            <div id="noResults" class="hidden flex flex-col items-center justify-center py-12 text-gray-500 bg-white">
                <i class="fa-regular fa-folder-open text-4xl mb-3 text-gray-300"></i>
                <p class="text-base">找不到符合的資料</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 mt-auto border-t border-gray-700">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm">© 2025 大溪國中教師查詢系統</p>
        </div>
    </footer>

            { category: 'substitute', title: '兼課教師', name: '蔡斐琳', email: 'tf51158@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '周文德', email: 'wende@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '方嘉雯', email: 'tf51204@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '盧和璟', email: 'tf51225@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '黃慶興', email: 'tf51042@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '廖惠如', email: 'tf51217@dsjh.tyc.edu.tw' },
            { category: 'substitute', title: '兼課教師', name: '郭鴻銘', email: 'tf51219@dsjh.tyc.edu.tw' }
        ];

        let currentCategory = 'all';

        // DOM Elements
        const teacherTableBody = document.getElementById('teacherTableBody');
        const searchInput = document.getElementById('searchInput');
        const resultCount = document.getElementById('resultCount');
        const noResults = document.getElementById('noResults');
        const tabs = document.querySelectorAll('.tab-btn');

        // Initial Render
        renderTable(teachersData);

        // Function to filter by category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update Tab Styles
            tabs.forEach(tab => {
                if (tab.getAttribute('onclick').includes(category)) {
                    tab.classList.remove('bg-white', 'text-gray-600', 'hover:bg-gray-100', 'border', 'border-gray-200');
                    tab.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-sm');
                } else {
                    tab.classList.add('bg-white', 'text-gray-600', 'hover:bg-gray-100', 'border', 'border-gray-200');
                    tab.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'shadow-sm');
                }
            });

            applyFilters();
        }

        // Search Input Listener
        searchInput.addEventListener('input', applyFilters);

        // Master Filter Function
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            const filtered = teachersData.filter(teacher => {
                const matchesCategory = currentCategory === 'all' || teacher.category === currentCategory;
                const matchesSearch = teacher.name.toLowerCase().includes(searchTerm) || 
                                      teacher.title.toLowerCase().includes(searchTerm) ||
                                      teacher.email.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            renderTable(filtered);
        }

        // Render Table Function
        function renderTable(data) {
            teacherTableBody.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
                resultCount.textContent = '找不到資料';
                return;
            } else {
                noResults.classList.add('hidden');
                resultCount.textContent = `顯示 ${data.length} 筆資料`;
            }

            data.forEach(teacher => {
                // Determine styling based on category
                let badgeClass = 'bg-gray-100 text-gray-800';

                if(teacher.category === 'admin') {
                    badgeClass = 'bg-purple-100 text-purple-800';
                } else if (teacher.category === 'homeroom') {
                    badgeClass = 'bg-green-100 text-green-800';
                } else if (teacher.category === 'substitute') {
                    badgeClass = 'bg-orange-100 text-orange-800';
                } else {
                    badgeClass = 'bg-blue-100 text-blue-800';
                }

                // Gmail Compose Link Logic
                // Opens in a new tab/window using target="_blank"
                const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=${teacher.email}`;

                const row = document.createElement('tr');
                row.className = 'border-b border-gray-200 hover:bg-gray-50 transition duration-150';

                row.innerHTML = `
                    <td class="px-5 py-4 whitespace-nowrap">
                        <span class="${badgeClass} px-2 py-1 text-xs font-semibold rounded-md">
                            ${teacher.title}
                        </span>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <div class="text-sm font-bold text-gray-900">${teacher.name}</div>
                    </td>
                    <td class="px-5 py-4 whitespace-nowrap">
                        <a href="${gmailLink}" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-600 hover:text-blue-800 hover:underline font-mono inline-flex items-center group" title="在新視窗開啟 Gmail 寄信給 ${teacher.name}">
                            <i class="fa-regular fa-envelope mr-2 text-gray-400 group-hover:text-blue-600"></i>
                            ${teacher.email}
                            <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs text-gray-400 group-hover:text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                    </td>
                `;
                teacherTableBody.appendChild(row);
            });
        }
    </script>
</body>

</html>

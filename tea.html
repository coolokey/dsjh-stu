    <style>

        }
        /* Hide scrollbar for tabs */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom smooth hover for table rows */
        .table-row-hover {
            transition: background-color 0.15s ease-in-out;
        }
        .table-row-hover:hover {
            background-color: #eff6ff; /* Blue-50 hover effect */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-200 selection:text-blue-900">

    <!-- Main Content -->

        <!-- Search Section -->

                    placeholder="輸入姓名、職稱關鍵字 (例如: 林晏瑄, 701, 數學, 主任)...">
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="mb-6 overflow-x-auto hide-scrollbar pb-2">
            <div class="flex space-x-2 min-w-max px-1" id="categoryTabs">
                <button onclick="filterCategory('all')" class="tab-btn active px-6 py-2.5 rounded-full text-base font-medium bg-blue-600 text-white shadow hover:bg-blue-700 transition-colors duration-200">
                    全部顯示

                <button onclick="filterCategory('admin')" class="tab-btn px-6 py-2.5 rounded-full text-base font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-gray-800 transition-colors duration-200">
                    行政人員
                </button>
                <button onclick="filterCategory('homeroom')" class="tab-btn px-6 py-2.5 rounded-full text-base font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-gray-800 transition-colors duration-200">
                    導師
                </button>
                <button onclick="filterCategory('teacher')" class="tab-btn px-6 py-2.5 rounded-full text-base font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-gray-800 transition-colors duration-200">
                    專任教師
                </button>
                <button onclick="filterCategory('substitute')" class="tab-btn px-6 py-2.5 rounded-full text-base font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:text-gray-800 transition-colors duration-200">
                    代課/兼課
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="flex justify-between items-center mb-2 px-1 text-gray-600 font-medium">
            <span id="resultCount" class="text-base">資料載入中...</span>
        </div>

                                姓名

        // Initial Render
        renderTable(teachersData);

        // Function to filter by category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update Tab Styles
            tabs.forEach(tab => {
                if (tab.getAttribute('onclick').includes(category)) {
                    tab.classList.remove('bg-white', 'text-gray-600', 'hover:bg-gray-50', 'border', 'border-gray-200');
                    tab.classList.add('bg-blue-600', 'text-white', 'shadow', 'hover:bg-blue-700');
                } else {
                    tab.classList.add('bg-white', 'text-gray-600', 'hover:bg-gray-50', 'border', 'border-gray-200');
                    tab.classList.remove('bg-blue-600', 'text-white', 'shadow', 'hover:bg-blue-700');
                }
            });

            applyFilters();
        }

        // Search Input Listener
        searchInput.addEventListener('input', applyFilters);

        // Master Filter Function
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            const filtered = teachersData.filter(teacher => {
                const matchesCategory = currentCategory === 'all' || teacher.category === currentCategory;
                const matchesSearch = teacher.name.toLowerCase().includes(searchTerm) || 
                                      teacher.title.toLowerCase().includes(searchTerm) ||
                                      teacher.email.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            renderTable(filtered);
        }

        // Render Table Function
        function renderTable(data) {
            teacherTableBody.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
                resultCount.textContent = '找不到符合條件的資料';
                return;
            } else {
                noResults.classList.add('hidden');
                resultCount.textContent = `顯示 ${data.length} 筆資料`;
            }

            data.forEach(teacher => {
                // Reverted badge colors to simpler solid/light style
                let badgeClass = 'bg-gray-100 text-gray-800';

                if(teacher.category === 'admin') {
                    badgeClass = 'bg-purple-100 text-purple-800';
                } else if (teacher.category === 'homeroom') {
                    badgeClass = 'bg-green-100 text-green-800';
                } else if (teacher.category === 'substitute') {
                    badgeClass = 'bg-orange-100 text-orange-800';
                } else {
                    badgeClass = 'bg-blue-100 text-blue-800';
                }

                // Gmail Compose Link Logic
                // If email is pending, still create a link but maybe to generic page or just empty
                const emailToUse = teacher.email === '待確認' ? '' : teacher.email;
                const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailToUse}`;

                const row = document.createElement('tr');
                row.className = 'table-row-hover border-b border-gray-100 last:border-b-0 group';

                row.innerHTML = `
                    <td class="px-6 py-3.5 whitespace-nowrap">
                        <span class="${badgeClass} px-3 py-1.5 text-sm font-semibold rounded-md tracking-wide">
                            ${teacher.title}
                        </span>
                    </td>
                    <td class="px-6 py-3.5 whitespace-nowrap">
                        <div class="text-xl font-bold text-gray-800">${teacher.name}</div>
                    </td>
                    <td class="px-6 py-3.5 whitespace-nowrap">
                        <a href="${gmailLink}" target="_blank" rel="noopener noreferrer" class="flex items-center w-fit text-lg text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-all duration-200 group-hover:shadow-sm" title="在新視窗開啟 Gmail 寄信給 ${teacher.name}">
                            <i class="fa-regular fa-envelope mr-3 text-gray-400 group-hover:text-blue-600 transition-colors"></i>
                            <span class="font-mono font-medium text-lg">${teacher.email}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-sm text-gray-400 opacity-50 group-hover:opacity-100 transition-all transform group-hover:translate-x-0.5"></i>
                        </a>
                    </td>
                `;
                teacherTableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
